# safe-motion-limits.cfg — Firmware-side anti-lost-step clamp for K1C & K1 Max
#
# Why this exists:
# Stock Creality Print / Creality Cloud profiles emit thousands of per-feature
# `SET_VELOCITY_LIMIT ACCEL=10000 ACCEL_TO_DECEL=10000 SQUARE_CORNER_VELOCITY=8`
# (or SCV=20 on K1 Max) lines plus `F30000` (500 mm/s) travel moves. Klipper's
# built-in `SET_VELOCITY_LIMIT` does NOT clamp to `[printer] max_accel`, so
# lowering `max_accel` in `printer.cfg` gets overwritten on layer 1.
#
# When `enabled=1` and a job is actively printing (`print_stats.state == "printing"`),
# this macro clamps:
#   * VELOCITY               <= 300 mm/s  (caps F30000 / 500 mm/s travels)
#   * ACCEL                  <= 5000 mm/s^2
#   * ACCEL_TO_DECEL         <= 5000 mm/s^2
#   * SQUARE_CORNER_VELOCITY <= 5.0 mm/s
#
# When idle (`state != "printing"`), commands pass through uncapped so
# `SHAPER_CALIBRATE` / `BELTS_SHAPER_CALIBRATION` work normally.
#
# Runtime control (no restart needed):
#   SAFE_MOTION_LIMITS                        ; report current status
#   SAFE_MOTION_LIMITS ENABLE=0               ; temporarily disable clamp
#   SAFE_MOTION_LIMITS ENABLE=1 ACCEL=5000 VELOCITY=300 SCV=5

[gcode_macro SET_VELOCITY_LIMIT]
rename_existing: SET_VELOCITY_LIMIT_RAW
description: Clamp print-time velocity, acceleration, and square corner velocity to prevent XY lost steps
variable_enabled: 1
variable_max_velocity: 300.0
variable_max_accel: 5000.0
variable_max_scv: 5.0
gcode:
  {% if params|length == 0 %}
    SET_VELOCITY_LIMIT_RAW
  {% elif enabled|int == 1 and printer.print_stats.state == "printing" %}
    {% set out = "" %}
    {% if 'VELOCITY' in params %}
      {% set v = params.VELOCITY|float %}
      {% if v > max_velocity %}{% set v = max_velocity %}{% endif %}
      {% set out = out ~ " VELOCITY=" ~ v %}
    {% elif printer.toolhead.max_velocity > max_velocity %}
      {% set out = out ~ " VELOCITY=" ~ max_velocity %}
    {% endif %}
    {% if 'ACCEL' in params %}
      {% set a = params.ACCEL|float %}
      {% if a > max_accel %}{% set a = max_accel %}{% endif %}
      {% set out = out ~ " ACCEL=" ~ a %}
    {% endif %}
    {% if 'ACCEL_TO_DECEL' in params %}
      {% set d = params.ACCEL_TO_DECEL|float %}
      {% if d > max_accel %}{% set d = max_accel %}{% endif %}
      {% set out = out ~ " ACCEL_TO_DECEL=" ~ d %}
    {% endif %}
    {% if 'SQUARE_CORNER_VELOCITY' in params %}
      {% set s = params.SQUARE_CORNER_VELOCITY|float %}
      {% if s > max_scv %}{% set s = max_scv %}{% endif %}
      {% set out = out ~ " SQUARE_CORNER_VELOCITY=" ~ s %}
    {% endif %}
    SET_VELOCITY_LIMIT_RAW{out}
  {% else %}
    SET_VELOCITY_LIMIT_RAW {rawparams}
  {% endif %}

[gcode_macro SAFE_MOTION_LIMITS]
description: View or adjust firmware print-time motion caps (ENABLE=0|1 VELOCITY=300 ACCEL=5000 SCV=5)
gcode:
  {% if 'ENABLE' in params %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=enabled VALUE={params.ENABLE|int}
  {% endif %}
  {% if 'VELOCITY' in params %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=max_velocity VALUE={params.VELOCITY|float}
  {% endif %}
  {% if 'ACCEL' in params %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=max_accel VALUE={params.ACCEL|float}
  {% endif %}
  {% if 'SCV' in params %}
    SET_GCODE_VARIABLE MACRO=SET_VELOCITY_LIMIT VARIABLE=max_scv VALUE={params.SCV|float}
  {% endif %}
  {% set m = printer['gcode_macro SET_VELOCITY_LIMIT'] %}
  {action_respond_info("SAFE_MOTION_LIMITS: enabled=%d max_velocity=%.1f max_accel=%.1f max_scv=%.1f (live toolhead: vel=%.1f accel=%.1f scv=%.1f)" % (
    m.enabled|int,
    m.max_velocity|float,
    m.max_accel|float,
    m.max_scv|float,
    printer.toolhead.max_velocity|float,
    printer.toolhead.max_accel|float,
    printer.toolhead.square_corner_velocity|float
  ))}
